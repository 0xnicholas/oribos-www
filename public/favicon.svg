<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Oribos</title>
  <style>
    .tile { fill: #111111; }
    .o { fill: none; stroke: #ff7a4d; stroke-width: 5; }
    @media (prefers-color-scheme: light) {
